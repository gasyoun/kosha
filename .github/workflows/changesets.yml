name: Changesets version PR

# H8385 (ADR-0005 rounds 2-3): version-bump PR flow for ui/ — a private
# versioned web build (Svelte+Vite into docs/inflect/, shipped via Pages).
# Publish stays OFF forever: the workflow has no `publish` step and ui/ is
# private. The kosha data release line keeps cut-release (root CHANGELOG.md +
# changelog_queue); the two release surfaces coexist by design.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: changesets-version-pr
  cancel-in-progress: false

jobs:
  version:
    name: Open or refresh the Version Packages PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm

      # Scoped install, NOT `npm ci`: the root anchor's lockfile carries every
      # workspace's deps, so a root `npm ci` pulls the whole Svelte/Vite ui tree
      # (CI disk/time cost — H8385 residual, MG 17-11-2026) just to run the
      # changesets CLI. `--workspaces=false --no-save` installs the CLI only
      # (verified locally: workspace devDeps skipped, `changeset` on PATH).
      - name: Install changesets CLI (skip the ui workspace tree)
        run: npm install --workspaces=false --no-save --no-audit --no-fund @changesets/cli@^2.29.7

      # No `publish` input by design — this repo never publishes to npm.
      - name: Version Packages PR
        uses: changesets/action@{"message":"Not # v1
        with:
          commit: "chore(changesets): version packages"
          title: "chore(changesets): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
