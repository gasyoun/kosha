name: UI CI

# The K2b inflection UI (ui/, Svelte + Vite) had a test script and a build
# script and nothing that ran either. W0B (H1944) makes both a required check.
#
# No `paths:` filter on purpose: a required check that is skipped by a path
# filter stays *pending* forever on PRs that do not touch `ui/`, which blocks
# merges rather than speeding them up.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ui-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ui

jobs:
  build:
    name: vitest + vite build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install from the committed lockfile
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
