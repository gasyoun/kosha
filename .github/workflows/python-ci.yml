name: Python CI

# W0B (H1944) — the fixture tier of D14's two-tier CI. Every PR proves that
# the declared build DAG runs end to end from an empty target against the
# committed public fixture pack, twice, and that the fixture-tier test suite
# passes. The full-data tier (real sibling feeds, ~4 GB) stays a workstation
# and release-gate concern; tests pinned to full-data counts skip themselves
# here via tests/conftest.py.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Fixture build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Generated-surface registry
        # W1B (H2342) — D15 surface registry. Fails when a row is missing
        # required fields, points at a non-owned builder, or lacks an
        # acceptance command. Also covered by pytest; this named step makes
        # the gate visible in the required PR check and cannot be skipped by
        # auto-merge (same job as Fixture build + tests).
        run: python scripts/validate_surfaces.py

      - name: Release archive gate
        # W2A (H2346/H2870) — the citation-archive release gate. It shipped as
        # a script no release path ever ran, so "fails closed" was a claim in a
        # docstring rather than a check. Run against the committed mini-archive
        # (prior + current identities) with an explicit durable public base, so
        # a regression in checksum identity, historical resolution, or the
        # citation host fails the required PR check like the surface registry
        # above.
        run: |
          python scripts/validate_release_archives.py \
            --archive-dir tests/fixtures/archives \
            --public-base https://gasyoun.github.io/kosha \
            --min-versions 2 \
            --sense-id mw.101.1

      - name: Declared stage order
        # The #210 regression guard, run before anything is built: the no-flag
        # plan must list every declared stage.
        run: python scripts/build_db.py --profile fixture --plan

      - name: Fixture build from zero
        run: python scripts/build_db.py --profile fixture

      - name: Fixture build again (idempotence + source lock)
        # A second run over unchanged sources must satisfy the lock written by
        # the first, and must not need --relock to do it.
        run: python scripts/build_db.py --profile fixture

      - name: Tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q -p no:cacheprovider

      - name: Dependency lock agrees with what the project declares
        # Replaces a check that read the lock and asserted it contained the
        # characters `==`. A lock pinning fastapi 0.136.1 against a declared
        # floor of >=0.140.0 satisfied that without difficulty. `--audit`
        # checks the invariants that hold on every platform: every declared
        # root is pinned, and no pin contradicts its declared specifier.
        run: python scripts/gen_requirements_lock.py --audit
